<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORKcalender - 미니멀 일정 관리</title>
    <!-- Pretendard 폰트 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <div class="header-top">
                <h1>WORKcalender</h1>
                <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
            </div>
            <p class="subtitle">이번 달의 주요 일정을 확인하세요.</p>
        </header>

        <section class="section key-events-section">
            <div class="section-header">
                <h2>Key Events</h2>
                <span class="badge">This Month</span>
            </div>
            <div id="key-events-container" class="key-events-grid">
                <!-- 주요 일정 카드가 JavaScript를 통해 렌더링됩니다 -->
            </div>
        </section>

        <section class="section all-events-section">
            <div class="section-header">
                <h2>All Schedule</h2>
            </div>
            <div class="list-header">
                <span class="col-date">Date</span>
                <span class="col-title">Event</span>
            </div>
            <ul id="all-events-list" class="all-events-list">
                <!-- 전체 일정 리스트가 JavaScript를 통해 렌더링됩니다 -->
            </ul>
        </section>
        
        <!-- 하단 여백 확보 -->
        <div style="height: 100px;"></div>
    </main>

    <!-- 하단 AI 입력창 -->
    <div class="ai-input-wrapper">
        <form id="ai-form" class="ai-input-container">
            <input type="text" id="ai-input" placeholder="예: 모레 오후 3시에 디자인 팀 회의 잡아줘" autocomplete="off" />
            <button type="submit" id="ai-submit" class="ai-submit-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z" fill="var(--color-bg)"/>
                </svg>
            </button>
        </form>
    </div>

    <!-- 설정 모달 -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p class="modal-desc">LLM AI 연동 및 GitHub 동기화를 위해 키를 입력해주세요. 입력하신 정보는 브라우저 내부(LocalStorage)에만 안전하게 저장됩니다.</p>
                <!-- OpenAI API Key 입력란 제거 (자체 자연어 엔진 사용) -->
                <div class="form-group">
                    <label for="github-pat">GitHub PAT (Fine-grained 또는 Classic)</label>
                    <input type="password" id="github-pat" placeholder="github_pat_..." />
                </div>
                <div class="form-group">
                    <label for="github-repo">GitHub Repository</label>
                    <input type="text" id="github-repo" placeholder="예: Markidier/WORKcalender" value="Markidier/WORKcalender" />
                </div>
                <button id="save-settings" class="btn-primary">저장하기</button>
            </div>
        </div>
    </div>

    <!-- 로딩 오버레이 -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p id="loading-text">AI가 일정을 분석하고 GitHub에 저장 중입니다...</p>
    </div>

    <!-- 템플릿: 주요 일정 카드 -->
    <template id="key-event-template">
        <article class="key-event-card">
            <div class="card-date"></div>
            <h3 class="card-title"></h3>
            <p class="card-desc"></p>
        </article>
    </template>

    <!-- 템플릿: 리스트 아이템 -->
    <template id="list-item-template">
        <li class="list-item">
            <div class="item-date"></div>
            <div class="item-content">
                <h3 class="item-title"></h3>
                <p class="item-desc"></p>
            </div>
        </li>
    </template>

    <script src="./script.js"></script>
</body>
</html>
